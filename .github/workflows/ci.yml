name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # --accept-nth requires fzf 0.60+, --with-shell 0.52+. Pin instead of relying on distro packages.
  FZF_VERSION: "0.65.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned fzf
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fzf"
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/fzf" fzf
          echo "$RUNNER_TEMP/fzf" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/fzf:$PATH"
          fzf --version
          # Fail loudly if the installed fzf lacks the flags the picker depends on.
          printf 'a\tb\n' | fzf --filter=a --delimiter '\t' --accept-nth=1 --with-shell 'sh -c' >/dev/null

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: OMP host suite (Bun)
        run: bun run test:omp

      - name: Pi host suite (Node)
        run: bun run test:pi
